<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>瓯创检测</title>
    <style src="reset.css"></style>
    <script src="js/jquery.min.js"></script>
</head>
<body>
    <div class="banner">
        <div class="logo">
            <img src="img/logo.png" alt="">
        </div>
        <div class="content-box">
          
        </div>
          <div class="content-title">
                <p>检测报告在线查询</p>
                
                <input type="text" value="OC20230208-2832"  id="name_c">
                <div class="button-box">查询</div>
            </div>
            <div class="hint yes" >
                报告编号为OC20230208-2832的检测报告存在
            </div>
            <div class="hint no" >
               抱歉，没有找到相关产品！建议你拨打咨询热线
            </div>
            <div class="form-box">
                <img src="img/bg.png" alt="">
            </div>
    </div>
    
</body>
</html>
<style>
    body{
        margin: 0px;
    }
.banner{
    position: relative;
    width: 100%;
    height: 100vh;
    background: #ffff;
}
.logo{
    width: 20%;
    margin-left: 8%;
    margin-top: 20px;

}
.logo img{
    width: 100%;
}
.content-box{
    width: 100%;
    height: 30vh;
    background: url("img/bj.jpg")no-repeat;
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
}
.content-title{
    position: absolute;
    width: 100%;
    top: 10%;
}
.content-title p{
    width: 100%;
    font-size: 20px;
    color: #ffff;
    text-align: center;
}
.content-title input{
    width: 80%;
    height: 20px;
    margin-left: 10%;
}
.button-box{
    margin-top: 20px;
    width: 82%;
    height: 30px;
    margin-left: 10%;
    text-align: center;
    line-height: 30px;
    background: #4874cb;
    font-size: 20px;
    color: #ffff;
    position: absolute;
}
.hint{
    width: 100%;
    height: 10vh;
    background: #f2f2f2;
    color: #c00000;
    text-align: center;
    line-height: 10vh;
}
.form-box{
    width: 100%;
    height: 30vh;
}
.form-box img{
    width: 100%;
}
.yes{
    display: block;
}
.no{
    display: none;
}
</style>
<script>
  
    $(".button-box").on('click', function () {
          var name_c = $("#name_c").val();
    if(name_c=="OC20230208-2832"){
        // console.log("11111")
        $(".yes").show()
         $(".no").hide()
           $(".form-box").show()
    }else{
        //  console.log("编号错误")
       $(".yes").hide()
       $(".no").show()
       $(".form-box").hide()
    }
    });
</script>
